<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>肩叩き券発行フォーム</title>
</head>
<body>

    <h1>肩叩き券発行フォーム</h1>

    <!-- フォームタグは使用せず、各入力項目を配置 -->
    <p>
        <label>住所:<br>
        <input type="text" id="address" placeholder="東京都千代田区..."></label>
    </p>

    <p>
        <label>電話番号 または メールアドレス:<br>
        <input type="text" id="contact" placeholder="090-XXXX-XXXX"></label>
    </p>

    <p>
        <label>カード番号:<br>
        <input type="text" id="cardNumber" placeholder="1234-5678-9012-3456"></label>
    </p>

    <!-- ページがリロードされない、ただのボタン -->
    <p>
        <button type="button" onclick="generateTicket()">肩叩き券を発行する</button>
    </p>

    <!-- 結果を表示するエリア -->
    <div id="result"></div>

    <script>
        function generateTicket() {
            // 固定ID 15431 を定義
            const ticketId = "15431";
            
            // 各入力欄から文字列を取得
            const address = document.getElementById('address').value;
            const contact = document.getElementById('contact').value;
            const cardNumber = document.getElementById('cardNumber').value;

            // 画面下部に結果を出力
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `
                <hr>
                <h2>【発行完了】</h2>
                <p><strong>管理ID:</strong> ${ticketId}</p>
                <p><strong>お届け先住所:</strong> ${address}</p>
                <p><strong>連絡先:</strong> ${contact}</p>
                <p><strong>決済カード番号:</strong> ${cardNumber}</p>
                <p>※上記の内容で「肩叩き券 (ID: ${ticketId})」を発行しました！</p>
            `;
        }
    </script>

</body>
</html>
